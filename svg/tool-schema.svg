<svg viewBox="0 0 370 310" xmlns="http://www.w3.org/2000/svg">
    <!-- Mandrin -->
    <rect x="75" y="22" width="220" height="62" rx="4" fill="#607080"/>
    <rect x="155" y="22" width="60" height="62" fill="#3E5060"/>
    <text x="112" y="52" font-size="11" fill="#DDE4EB" font-family="sans-serif" font-weight="bold">Mandrin</text>
    <text x="112" y="66" font-size="9" fill="#B8C8D8" font-family="sans-serif">(porte-outil)</text>
    <!-- Shaft non-fluted -->
    <rect x="155" y="84" width="60" height="100" fill="#A8B8C8"/>
    <!-- Fluted zone (LCF) -->
    <rect x="155" y="184" width="60" height="88" fill="#8098B0"/>
    <line x1="164" y1="184" x2="164" y2="272" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="173" y1="184" x2="173" y2="272" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="185" y1="184" x2="185" y2="272" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="197" y1="184" x2="197" y2="272" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="206" y1="184" x2="206" y2="272" stroke="#5A7A96" stroke-width="1.5"/>
    <!-- Tip -->
    <polygon points="155,272 215,272 185,292" fill="#8098B0"/>
    <!-- SD annotation (top) -->
    <text x="185" y="9" text-anchor="middle" font-size="10" fill="#405B75" font-family="sans-serif">Ø queue (SD)</text>
    <line x1="155" y1="14" x2="215" y2="14" stroke="#405B75" stroke-width="1.5"/>
    <line x1="155" y1="10" x2="155" y2="18" stroke="#405B75" stroke-width="1.5"/>
    <line x1="215" y1="10" x2="215" y2="18" stroke="#405B75" stroke-width="1.5"/>
    <!-- OAL (left outer) -->
    <line x1="105" y1="22" x2="105" y2="292" stroke="#405B75" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="99" y1="22" x2="111" y2="22" stroke="#405B75" stroke-width="1.5"/>
    <line x1="99" y1="292" x2="111" y2="292" stroke="#405B75" stroke-width="1.5"/>
    <text x="100" y="155" text-anchor="end" font-size="11" fill="#405B75" font-family="sans-serif">OAL</text>
    <!-- Épaulement (left inner) -->
    <line x1="125" y1="184" x2="125" y2="292" stroke="#405B75" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="119" y1="184" x2="131" y2="184" stroke="#405B75" stroke-width="1.5"/>
    <line x1="119" y1="292" x2="131" y2="292" stroke="#405B75" stroke-width="1.5"/>
    <text x="120" y="240" text-anchor="end" font-size="10" fill="#405B75" font-family="sans-serif">Épaulement</text>
    <!-- LB (right inner) -->
    <line x1="245" y1="84" x2="245" y2="292" stroke="#405B75" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="239" y1="84" x2="251" y2="84" stroke="#405B75" stroke-width="1.5"/>
    <line x1="239" y1="292" x2="251" y2="292" stroke="#405B75" stroke-width="1.5"/>
    <text x="250" y="192" text-anchor="start" font-size="11" fill="#405B75" font-family="sans-serif">LB</text>
    <!-- LCF (right outer) -->
    <line x1="265" y1="184" x2="265" y2="292" stroke="#405B75" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="259" y1="184" x2="271" y2="184" stroke="#405B75" stroke-width="1.5"/>
    <line x1="259" y1="292" x2="271" y2="292" stroke="#405B75" stroke-width="1.5"/>
    <text x="270" y="240" text-anchor="start" font-size="11" fill="#405B75" font-family="sans-serif">LCF</text>
</svg>
